name: Lint

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Syntax-check all PHP files
        run: find ps_ga4_datalayer -name '*.php' -print0 | xargs -0 -n1 php -l

      # php -l cannot catch calls to methods that don't exist in PrestaShop
      # 9 - those are runtime fatals that blank the storefront. This runs
      # every hook against stubs to catch exactly that.
      - name: Hook smoke test (no fatals, no swallowed errors)
        run: php tests/hook-smoke-test.php

      - name: DataLayer ecommerce-clearing test
        run: php tests/datalayer-ecommerce-clear-test.php

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check front.js
        run: node --check ps_ga4_datalayer/views/js/front.js

      - name: add_to_wishlist dataLayer test
        run: node tests/wishlist-datalayer-test.js

      - name: Event-trigger contract test
        run: node tests/event-triggers-test.js
